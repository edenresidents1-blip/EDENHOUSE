backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "gallery"
    label: "Photo Gallery"
    files:
      - name: "gallery"
        label: "Gallery Photos"
        file: "data/gallery.json"
        fields:
          - name: "items"
            label: "Photos"
            label_singular: "Photo"
            widget: "list"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "caption", label: "Caption", widget: "string" }

  - name: "calendar_ltc"
    label: "Long-Term Care Calendar & Newsletter"
    files:
      - name: "calendar_ltc"
        label: "LTC Calendar / Newsletter Pages"
        file: "data/calendar-ltc.json"
        fields:
          - name: "items"
            label: "Pages"
            label_singular: "Page"
            widget: "list"
            fields:
              - { name: "src", label: "Image (calendar or newsletter page)", widget: "image" }
              - { name: "label", label: "Label (e.g. 'LTC Calendar – August 2026')", widget: "string" }

  - name: "calendar_ret"
    label: "Retirement Home Calendar & Newsletter"
    files:
      - name: "calendar_ret"
        label: "Retirement Home Calendar / Newsletter Pages"
        file: "data/calendar-ret.json"
        fields:
          - name: "items"
            label: "Pages"
            label_singular: "Page"
            widget: "list"
            fields:
              - { name: "src", label: "Image (calendar or newsletter page)", widget: "image" }
              - { name: "label", label: "Label (e.g. 'Retirement Calendar – August 2026')", widget: "string" }
