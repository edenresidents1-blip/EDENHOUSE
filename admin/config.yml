backend:
  name: git-gateway
  branch: main

# Where uploaded photos get stored in the repo, and the URL path they're served from
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "gallery"
    label: "Photo Gallery"
    files:
      - name: "gallery"
        label: "Gallery Photos"
        file: "data/gallery.json"
        fields:
          - name: "items"
            label: "Photos"
            label_singular: "Photo"
            widget: "list"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "caption", label: "Caption", widget: "string" }

  - name: "calendar_ltc"
    label: "Long-Term Care Calendar & Newsletter"
    files:
      - name: "calendar_ltc"
        label: "LTC Monthly Calendar"
        file: "data/calendar-ltc.json"
        fields:
          - { name: "image", label: "This Month's Calendar Image", widget: "image" }
          - { name: "label", label: "Label (e.g. 'August 2026 — Long-Term Care Activities Calendar & Newsletter')", widget: "string" }

  - name: "calendar_ret"
    label: "Retirement Home Calendar & Newsletter"
    files:
      - name: "calendar_ret"
        label: "Retirement Home Monthly Calendar"
        file: "data/calendar-ret.json"
        fields:
          - { name: "image", label: "This Month's Calendar Image", widget: "image" }
          - { name: "label", label: "Label (e.g. 'August 2026 — Retirement Home Activities Calendar & Newsletter')", widget: "string" }
